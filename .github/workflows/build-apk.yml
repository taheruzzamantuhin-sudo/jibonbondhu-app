name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          node make-books.js

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications

      - name: Add Android project
        run: npx cap add android

      - name: Make app icon
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          npx @capacitor/assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jibonbondhu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
